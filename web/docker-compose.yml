services:
  db:
    image: postgres:13
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-pass}
      PGDATABASE: db

    ports:
      - 127.0.0.1:${LOCAL_DB_PORT:-5432}:5432

    volumes:
      - db-data0:/var/lib/postgresql/data

  app:
    restart: unless-stopped
    build: .
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - FLASK_APP=wsgi:app
      - ALERT_SUPPORT_EMAILS=${ALERT_SUPPORT_EMAILS}
    ports:
      - 127.0.0.1:${APP_PORT}:5000
    entrypoint: "bash start_server.sh"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /etc/DigiCert:/etc/DigiCert:ro
    depends_on:
      - db

  backup:
    image: simple2b/pg-backup:1.0

    links:
      - db
    restart: always
    volumes:
      - ./backup:/backup
    environment:
      # scheduler
      SCHEDULE_HOUR: ${SCHEDULE_HOUR:-0}
      SCHEDULE_MINUTE: ${SCHEDULE_MINUTE:-0}
      SCHEDULE_SECOND: ${SCHEDULE_SECOND:-0}
      POSTGRES_HOST: db
      POSTGRES_DATABASE: db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-passwd}
      POSTGRES_EXTRA_OPTS: "--schema=public --blobs"
      DAYS_HISTORY: 7

  celery_worker:
    container_name: "celery_worker"
    restart: unless-stopped
    build: .
    env_file:
      - .env
    environment:
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_ADDR=redis:${REDIS_PORT}
      - BACKUP_DIR=${BACKUP_DIR}
      - FLASK_ENV=production
      - FLASK_APP=wsgi:app
      - FLASK_DEBUG=1
      - ALERT_SUPPORT_EMAILS=${ALERT_SUPPORT_EMAILS}
    depends_on:
      - db
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /etc/DigiCert:/etc/DigiCert:ro
    command: >
      celery -A worker worker -B -S redbeat.RedBeatScheduler --loglevel=INFO

  redis:
    restart: unless-stopped
    image: redis:alpine
    ports:
      - 127.0.0.1:6379:6379
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: >
      --requirepass ${REDIS_PASSWORD}

  file_api:
    build:
      context: ./file_api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "127.0.0.1:${FILE_API_PORT:-33000}:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      FLASK_INTERNAL_URL: http://app:5000
      TZ: America/New_York
      NODE_ENV: production
      USE_PRETTY_LOGS: "false"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /etc/DigiCert:/etc/DigiCert:ro
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  db-data0:
